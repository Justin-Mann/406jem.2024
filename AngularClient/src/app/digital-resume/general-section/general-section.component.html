@if (profileItems() && sectionName()) {
  <mat-card appearance="outlined" class="jem-mat-card resume-section-card">
    <mat-card-header>
      <mat-card-title>{{ sectionName() }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <ul class="fancyList">
        @for (item of profileItems()!; track item) {
          <li>{{ item }}</li>
        }
      </ul>
    </mat-card-content>
  </mat-card>
}
