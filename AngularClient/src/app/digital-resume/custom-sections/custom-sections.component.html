@for (item of (customItems() ?? []); track item.name) {
  <mat-card appearance="outlined" class="jem-mat-card resume-section-card">
    <mat-card-header>
      <mat-card-title>{{ item.name }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <ul class="customItemList">
        @for (citem of item.customItems; track citem.value) {
          <li>{{ citem.value }}</li>
        }
      </ul>
    </mat-card-content>
  </mat-card>
}
