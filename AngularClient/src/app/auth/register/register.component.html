<div class="container">
  <div class="row">
    <div class="col col-sm-6 col-12 offset-sm-3">
      <h2>Create an Account</h2>
      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" name="username" class="form-control" [(ngModel)]="username" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" [(ngModel)]="email" required email />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control" [(ngModel)]="password" required minlength="8" />
          <div class="form-text">At least 8 characters.</div>
        </div>
        @if (errorMessage()) {
          <div class="alert alert-danger">{{ errorMessage() }}</div>
        }
        <button type="submit" class="btn btn-primary" [disabled]="isBusy() || registerForm.invalid">Register</button>
      </form>
      <p class="mt-3">Already have an account? <a routerLink="/login">Log in</a></p>
    </div>
  </div>
</div>
