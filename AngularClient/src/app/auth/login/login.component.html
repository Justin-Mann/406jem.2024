<div class="container">
  <div class="row">
    <div class="col col-sm-6 col-12 offset-sm-3">
      <mat-card appearance="outlined" class="jem-mat-card auth-card">
        <mat-card-header>
          <mat-card-title>Log In</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Username</mat-label>
              <input matInput id="username" name="username" [(ngModel)]="username" required />
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Password</mat-label>
              <input matInput id="password" name="password" type="password" [(ngModel)]="password" required />
            </mat-form-field>
            @if (errorMessage()) {
              <div class="alert alert-danger">{{ errorMessage() }}</div>
            }
            <button mat-flat-button type="submit" [disabled]="isBusy() || loginForm.invalid">Log In</button>
          </form>
          <p class="mt-3">Don't have an account? <a routerLink="/register">Register</a></p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
