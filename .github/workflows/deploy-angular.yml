name: Deploy – Angular Client (Azure SWA)

on:
  push:
    branches:
      - main
    paths:
      - 'AngularClient/**'
      - '.github/workflows/deploy-angular.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'AngularClient/**'
      - '.github/workflows/deploy-angular.yml'
  workflow_dispatch:


jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test Angular Client
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: AngularClient/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./AngularClient

      - name: Run tests
        run: npx ng test --watch=false --no-progress --browsers=ChromeHeadless
        working-directory: ./AngularClient

      - name: Notify Claude of test failures
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_NOTIFY_PAT }}
        run: |
          ISSUE_NUMBER=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.CLAUDE_NOTIFY_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d '{"title":"Test failures blocked Angular Client deploy (${{ github.sha }})","body":"Automated: unit tests failed in the deploy pipeline."}' \
            | jq -r '.number')
          gh issue comment "$ISSUE_NUMBER" --body "@claude

          Unit tests failed and blocked the **${{ github.workflow }}** deploy pipeline.

          - Commit: \`${{ github.sha }}\`
          - Branch: \`${{ github.ref_name }}\`
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please read the test failure output from the CI run above, find the root cause
          in the AngularClient code or tests, fix it, and open a pull request."

  # PR preview deploys — ungated, so the existing "check the live preview before
  # merging" workflow (see CLAUDE.md's human-approval-gate note) keeps working exactly
  # as before. Only the production-facing job below requires manual approval.
  deploy_preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    needs: test
    name: Build and Deploy Angular Client
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: AngularClient/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./AngularClient

      - name: Build
        run: npx ng build
        working-directory: ./AngularClient

      # Builds in this job, not Azure's remote Oryx build - Oryx's supported Node
      # version list doesn't include anything that satisfies Angular's own minimum
      # (needs 22.22.3+, 24.15.0+, or 26.0.0+; Oryx currently tops out at 22.22.0
      # and 24.13.0). skip_app_build uploads the already-built dist/ output instead
      # of asking Azure to build it.
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_CLIFF_07E56211E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./AngularClient/dist/angular-client/browser"
          skip_app_build: true

  # Production deploy — gated behind an explicit workflow_dispatch, not automatic
  # on push: a push to main only runs tests, nothing deploys until manually
  # triggered (Actions tab → this workflow → "Run workflow"). GitHub's environment-
  # protection "required reviewers" was tried first, but can_admins_bypass defaults
  # to true and isn't overridable via the API for a personal-account (non-org) repo
  # — the repo owner always bypasses it, which is every deploy here. This
  # workflow_dispatch-only gate is a real pause point that doesn't depend on that.
  deploy_production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    name: Build and Deploy Angular Client (Production)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: AngularClient/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./AngularClient

      - name: Build
        run: npx ng build
        working-directory: ./AngularClient

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_CLIFF_07E56211E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./AngularClient/dist/angular-client/browser"
          skip_app_build: true

  close_staging_environment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR Staging Environment
    steps:
      - name: Close Pull Request Staging Environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_CLIFF_07E56211E }}
          action: "close"
          app_location: "./AngularClient"
