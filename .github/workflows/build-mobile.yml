name: Build – Mobile Client (Kotlin Multiplatform)

# Builds and tests MobileClient's Android + iOS targets on every change. Runs on
# macos-latest specifically because the iOS target needs Xcode, which only
# macOS runners provide (GitHub Actions macOS runners come with Xcode
# preinstalled — no separate CI platform needed for this).
#
# Build/test verification only — no code signing, no App Store/Play Store
# publishing. That remains a deliberate follow-up once the app itself exists
# and this workflow is proven out.

on:
  push:
    branches:
      - main
    paths:
      - 'MobileClient/**'
      - '.github/workflows/build-mobile.yml'
  pull_request:
    paths:
      - 'MobileClient/**'
      - '.github/workflows/build-mobile.yml'

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check MobileClient exists
        id: check
        run: |
          if [ -f "MobileClient/gradlew" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MobileClient/ doesn't exist yet (issue #34 not implemented) — nothing to build."
          fi

      - name: Setup JDK
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.exists == 'true'
        working-directory: MobileClient
        run: chmod +x ./gradlew

      - name: Build and test all targets (Android + iOS)
        if: steps.check.outputs.exists == 'true'
        working-directory: MobileClient
        run: ./gradlew build
