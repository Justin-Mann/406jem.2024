name: Stage 0 - Ideate Site Improvements

# Runs on a schedule (and on-demand via workflow_dispatch), researches a small,
# concrete improvement for the site, and opens a labeled issue to kick off
# Stage 1 of the pipeline. Does not touch code itself.
#
# Required GitHub secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — Claude Code OAuth token
#   CLAUDE_NOTIFY_PAT       — fine-grained PAT with issues:write, pull-requests:read,
#                             contents:read. Must be a PAT (not GITHUB_TOKEN): labels
#                             added by the default GITHUB_TOKEN do not trigger other
#                             workflow runs, so Stage 1 would never fire.

on:
  schedule:
    - cron: '0 15 * * 1' # Monday 15:00 UTC
  workflow_dispatch:

jobs:
  ideate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Claude - Propose a Site Improvement
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_NOTIFY_PAT }}
          claude_args: "--max-turns 20 --permission-mode bypassPermissions"
          prompt: |
            You are Stage 0 of a multi-agent CI/CD pipeline for the 406jem.2026 repository —
            a personal portfolio/resume site (Blazor + Angular clients, Azure Functions API).

            Your job is to find ONE small, concrete, worthwhile improvement to the site and
            open a GitHub issue describing it. You do NOT implement anything — later stages
            of the pipeline handle branching, coding, and review. Read CLAUDE.md first for
            full repo context.

            Step 1 — Check for pipeline backlog:
            Run `gh issue list --label claude --state open` and `gh pr list --state open`.
            If either returns any results, a previous cycle is still in flight — post nothing
            and end immediately. Do not queue up a second idea on top of an unfinished one.
            (Issues labeled "proposed" awaiting approval do NOT count as backlog — it's fine to
            propose a new idea while older ones are still awaiting a 👍/👎, since nothing is
            actually in flight for those.)

            Step 2 — Competitor research file (read first, refresh rarely):
            Read `.github/ideate-data/competitor-resume-sites.md`. Check its "Last updated" date.
            - If the file is missing, empty, or its date is more than ~60 days old: spend up to
              3 of your 4 web searches researching 3-5 notable resume/portfolio/developer-portfolio
              sites (well-known personal sites, template galleries, or sites explicitly praised in
              career/dev-portfolio roundups) and what specific features make them effective. Rewrite
              the file with a "Last updated" date and a ranked list (site name, URL, notable
              features, why relevant). Commit and push it directly to `main` with message
              "docs: refresh competitor resume-site research [automated]" (same direct-to-main
              pattern `claude-maintain-md.yml` already uses for doc/data files — no PR needed).
            - Otherwise: skip researching, just use the existing file's contents as-is. This keeps
              routine runs cheap — most runs should only read this file, not re-research it.

            Step 3 — Research current site + remaining budget:
            Look at the current resume/site content (fetch `GET https://api.406jem.com/api/resumes/myresume`
            for the live, current resume data — NOT the static
            StaticData/Resumes/JustinMann_062024.json file, which is stale/superseded), the
            Blazor/Angular page components, and Projects pages, to understand what's already
            there. Use any remaining web-search budget (out of the 4 total) for anything not
            already covered by the competitor research file. Stay tightly scoped to this site; do
            not go on an open-ended research tangent.

            Step 4 — Pick ONE idea:
            Choose a single change scoped to roughly one PR: a content addition, a small
            feature, or a presentation improvement — draw on the competitor research file as a
            primary source of inspiration, alongside your own read of the current site. Prefer
            concrete and verifiable over vague ("add a testimonials section sourced from X" beats
            "improve the site's appeal"). It must be implementable by an autonomous coding agent
            working from the issue text alone, and must respect the shared design language and
            conventions in CLAUDE.md.

            Step 5 — Open the issue (proposed, not yet approved):
            Use `gh issue create` to file it with:
            - A clear, specific title.
            - A body with: the idea, why it's worth doing (cite what you found — from the
              competitor file and/or fresh research), which project(s) it touches (BlazorClient /
              AngularClient / ResumeFunctions), concrete acceptance criteria, and this line
              verbatim at the end: "👍 this issue to approve it for implementation, or 👎 (or
              just ignore it) to decline."
            Then add the "proposed" label (`gh issue edit <number> --add-label proposed`) —
            NOT "claude". This issue is now a pending proposal; a separate scheduled workflow
            watches for a 👍 reaction and promotes it into the pipeline. Do not add "claude"
            yourself and do not implement anything.

            If you don't find anything genuinely worth doing, it is fine to open nothing — do
            not create a low-value issue just to produce output.
