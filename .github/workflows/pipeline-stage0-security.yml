name: Stage 0 (Security) - Vulnerability Watch

# Dedicated to GitHub's own vulnerability signal (Dependabot alerts). Sweeps daily,
# groups open alerts per project, and opens a labeled issue so Stage 1 picks it up
# automatically. Does not fix anything itself — later stages handle branching,
# coding, and review.
#
# Note: there is no native `dependabot_alert` Actions trigger (it doesn't appear in
# GitHub's events-that-trigger-workflows list) — an earlier version of this workflow
# tried it and GitHub rejected the whole file at parse time (startup_failure, 0s
# run). The daily cron sweep is the only automatic trigger; workflow_dispatch covers
# on-demand runs.
#
# Required GitHub secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — Claude Code OAuth token
#   CLAUDE_NOTIFY_PAT       — fine-grained PAT with issues:write, pull-requests:read,
#                             contents:read. Must be a PAT, not GITHUB_TOKEN — labels
#                             added by GITHUB_TOKEN don't trigger Stage 1 (see
#                             CLAUDE.md's pipeline token note).
#                             ALSO needs "Dependabot alerts: Read-only" permission
#                             added on the PAT itself, or the alert-listing API call
#                             will 403. This can't be set via the GitHub CLI/API —
#                             it must be added in the PAT's own settings page.

on:
  schedule:
    - cron: '0 13 * * *' # daily 13:00 UTC sweep
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v4

      - name: Claude - Triage Vulnerability Alerts
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_NOTIFY_PAT }}
          claude_args: "--max-turns 30 --permission-mode bypassPermissions"
          prompt: |
            You are Stage 0 (Security) of a multi-agent CI/CD pipeline for the 406jem.2026
            repository — a personal portfolio/resume site (Blazor + Angular clients, Azure
            Functions API). Your job is to turn open GitHub Dependabot alerts into feature
            request issues for the pipeline. You do NOT fix anything yourself.

            Step 1 — Fetch open alerts:
            Run `gh api "repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" --paginate --jq '.[] | {number, severity: .security_advisory.severity, package: .dependency.package.name, manifest: .dependency.manifest_path, ghsa: .security_advisory.ghsa_id, cve: .security_advisory.cve_id, summary: .security_advisory.summary, html_url}'`.
            This trims each alert to the essentials — the raw response includes full CVE
            descriptions/references per alert and will burn your turn budget fast with 30+
            open alerts. Only fetch an individual alert's full description via a plain
            `gh api repos/.../dependabot/alerts/<number>` call if you genuinely need the
            patched-version details for one specific alert while writing the issue body.
            If there are no open alerts at all, stop — post nothing.

            Step 2 — Group:
            Group the alerts by `manifest_path` (e.g. AngularClient/package-lock.json,
            BlazorClient/*.csproj, ResumeFunctions/*.csproj). Each group maps to one project.

            Step 3 — Dedupe against existing tracking:
            Run `gh issue list --label security --state open --json number,title,body`.
            For each group, check whether an existing open issue already lists the same set
            (or a superset) of currently-open alert numbers for that manifest. If so, skip
            that group entirely — do not open a duplicate or a "refresh" issue.

            Step 4 — Open one issue per remaining group (cap: at most 3 issues per run):
            Title: "Security: N open Dependabot alerts in <project>". Body must include:
            - Total alert count and a severity breakdown (critical/high/moderate/low).
            - A table of affected packages, severity, and the advisory link, for at least
              all high/critical ones.
            - A concrete recommended action. Check whether the ecosystem's own audit tool
              (`npm audit fix` for npm, `dotnet list package --vulnerable` guidance for NuGet)
              can resolve them WITHOUT a breaking/major version bump. State plainly which
              alerts are fixable that way.
            - For any alerts that only resolve via a breaking/major version upgrade (e.g. no
              patched version exists on the currently used major version line), say so
              explicitly and prefix the issue title with "[Major Upgrade]" — these need extra
              scrutiny in review and may require coordinated updates across related packages
              (e.g. a framework and its component libraries moving together).
            Then label the issue "claude" and "security"
            (`gh issue edit <number> --add-label claude,security`) so Stage 1 of the pipeline
            picks it up automatically.

            Be accurate and specific — the downstream implementation agent will act on your
            issue text alone, without re-deriving which alerts are real or which fix path is safe.
