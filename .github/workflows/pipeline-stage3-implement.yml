name: Stage 3 - Implement Code

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ready-for-coding'
    concurrency:
      group: stage3-implement-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Claude - Implement Feature
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_NOTIFY_PAT }}
          claude_args: "--permission-mode bypassPermissions"
          show_full_output: true
          prompt: |
            You are Stage 3 of a multi-agent CI/CD pipeline for the 406jem.2026 repository.

            Issue #${{ github.event.issue.number }} has a branch and draft PR ready. Now implement the feature.

            Title: ${{ github.event.issue.title }}
            Body:
            ${{ github.event.issue.body }}

            Repository context (high-level only — CLAUDE.md is the source of truth for current
            tech stack, conventions, and endpoints; this list drifts as the codebase evolves, so
            defer to CLAUDE.md wherever the two disagree):
            - Blazor client (BlazorClient/): Blazor WASM on .NET 10; deploys to Azure Static Web Apps
            - Angular client (AngularClient/): Angular, standalone components, signal-based inputs, @if/@for control flow; deploys to Azure Static Web Apps
            - ResumeFunctions (ResumeFunctions/): Azure Functions v4 isolated worker on .NET 10; the
              backend API — has grown well beyond a single endpoint (auth, testimonials, resume
              admin CRUD, AI parsing, snapshots, and more), so check CLAUDE.md's ResumeFunctions
              section for the current endpoint list rather than assuming; deploys to Azure Functions
              at https://api.406jem.com (custom domain — required for cross-subdomain cookie auth)
            - Both frontend clients must be visually and functionally in sync
            - Shared design tokens: --jem-navy #1e2d5a, --jem-blue #245a8e, --jem-bg #f4f6fb
            - MobileClient (MobileClient/, if the issue calls for it): Kotlin Multiplatform + Compose
              Multiplatform, JDK 21 is available in this job. `.github/workflows/build-mobile.yml`
              builds and tests both the Android and iOS targets on a macOS runner (Xcode is only
              available there, not in this job) — that workflow is the real build/test gate for this
              project; this job can still run `./gradlew build` here to catch Android/common-target
              issues early, but can't verify the iOS target itself.

            Your job:
            1. Check out the feature branch created in Stage 2 (feature/issue-${{ github.event.issue.number }}-*).
            2. Read the existing codebase (especially CLAUDE.md) to understand the current structure.
            3. Implement all changes described in the issue, following existing conventions.
            4. Build and verify the solution compiles (dotnet build in relevant projects, npm ci && ng build in AngularClient, ./gradlew build in MobileClient if applicable).
            5. Commit your changes with a clear commit message referencing the issue.
            6. Push the branch.
            7. Mark the PR ready for review if it's still a draft (`gh pr ready <PR-number>`).
            8. Request a review from GitHub Copilot as an independent parallel reviewer, in addition
               to Stage 4's own review: `gh pr edit <PR-number> --add-reviewer copilot-pull-request-reviewer[bot]`.
               This is best-effort — if Copilot review isn't available/enabled for this repo, that
               command may fail; don't let it block the rest of the pipeline.
            9. Add the label "ready-for-review" to the issue to trigger Stage 4.
            10. Post a comment summarizing what was changed.

            IMPORTANT — no background/async work: this job runs as a single synchronous step in
            a GitHub Actions run. There is no mechanism for you to be "notified later" or to
            resume this conversation after the job ends — once your turn ends, this job ends,
            uncommitted and unpushed. If you delegate any part of the implementation to a
            sub-agent (e.g. splitting Blazor and Angular work), you MUST wait for it to actually
            finish and incorporate its result within this same run before ending your turn.
            Never end your turn describing work as "in progress" or something you'll "continue
            once notified" — for a large issue, either complete it fully in this run (waiting on
            every sub-agent call to actually return), or commit and push whatever real, working
            subset you did finish and say so plainly in your summary comment, rather than ending
            with nothing committed at all.
