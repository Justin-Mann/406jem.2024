name: ops-check-anthropic-logs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Enable verbose filesystem logging
        run: |
          az webapp log config --name 406resumeapi --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --application-logging filesystem --level verbose

      - name: Stream live logs for 75s (trigger the parse call from elsewhere during this window)
        run: |
          timeout 75 az webapp log tail --name 406resumeapi --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" > tail.log 2>&1 || true
          echo "----- CAPTURED LOG -----"
          cat tail.log
