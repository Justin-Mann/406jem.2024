name: ops-check-anthropic-logs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: List all App Insights resources in the resource group
        id: ai
        run: |
          az resource list --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --resource-type "microsoft.insights/components" -o table
          NAME=$(az resource list --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --resource-type "microsoft.insights/components" --query "[0].name" -o tsv)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using App Insights resource: $NAME"

      - name: Confirm Anthropic:ApiKey app setting is present (name only, not value)
        run: |
          az functionapp config appsettings list --name 406resumeapi --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[?name=='Anthropic:ApiKey' || name=='APPLICATIONINSIGHTS_CONNECTION_STRING' || name=='APPINSIGHTS_INSTRUMENTATIONKEY'].name" -o tsv

      - name: Query ALL recent traces/exceptions (sanity check logs are flowing at all)
        if: steps.ai.outputs.name != ''
        run: |
          az monitor app-insights query \
            --app "${{ steps.ai.outputs.name }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --analytics-query "union traces, exceptions | where timestamp > ago(3h) | order by timestamp desc | take 30 | project timestamp, itemType, message, innermostMessage=iif(itemType=='exception', tostring(details[0].outerMessage), ''), cloud_RoleName" \
            -o table

      - name: Query recent traces/exceptions mentioning Anthropic or resume parse
        if: steps.ai.outputs.name != ''
        run: |
          az monitor app-insights query \
            --app "${{ steps.ai.outputs.name }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --analytics-query "union traces, exceptions | where timestamp > ago(3h) | where message has 'Anthropic' or message has 'resume' or tostring(details) has 'Anthropic' | order by timestamp desc | take 30 | project timestamp, itemType, message, details=tostring(details)" \
            -o table
