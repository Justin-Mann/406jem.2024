name: ops-check-anthropic-logs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch Anthropic:ApiKey value into env (masked)
        run: |
          KEY=$(az functionapp config appsettings list --name 406resumeapi --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[?name=='Anthropic:ApiKey'].value" -o tsv)
          echo "::add-mask::$KEY"
          echo "DIAG_ANTHROPIC_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run diagnostic call against the real Anthropic API
        run: dotnet run --project tools/DiagTool/DiagTool.csproj -- BlazorClient/wwwroot/docs/jmResume.8.2025.pdf
