name: Ops - Set ResumeFunctions Auth App Settings

# One-off, manually-triggered utility to apply the auth app settings the
# issue #25 user-accounts feature requires (Auth:JwtSigningKey, Auth:AdminUsername,
# Auth:AdminPassword, Auth:AdminEmail) to both the production and staging slots
# of the ResumeFunctions Function App. These were missing after the feature's
# first deploy, which crashed the staging slot (see issue #35).
#
# Reads values from temporary repo secrets (TEMP_AUTH_*) rather than
# workflow_dispatch inputs, since dispatch inputs are visible in the run's
# event log and would leak the values. Delete this workflow file and the
# TEMP_AUTH_* secrets once it has run successfully.
#
# Required GitHub secrets:
#   AZURE_CREDENTIALS        — service principal JSON (already used by deploy-functions.yml)
#   TEMP_AUTH_JWT_SIGNING_KEY
#   TEMP_AUTH_ADMIN_USERNAME
#   TEMP_AUTH_ADMIN_PASSWORD
#   TEMP_AUTH_ADMIN_EMAIL
#
# Required GitHub repository variables:
#   AZURE_RESOURCE_GROUP

on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 406resumeapi

jobs:
  set-app-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set app settings on production slot
        run: |
          az functionapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --settings \
              "Auth:JwtSigningKey=${{ secrets.TEMP_AUTH_JWT_SIGNING_KEY }}" \
              "Auth:AdminUsername=${{ secrets.TEMP_AUTH_ADMIN_USERNAME }}" \
              "Auth:AdminPassword=${{ secrets.TEMP_AUTH_ADMIN_PASSWORD }}" \
              "Auth:AdminEmail=${{ secrets.TEMP_AUTH_ADMIN_EMAIL }}" \
            --output none

      - name: Set app settings on staging slot
        run: |
          az functionapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --slot staging \
            --settings \
              "Auth:JwtSigningKey=${{ secrets.TEMP_AUTH_JWT_SIGNING_KEY }}" \
              "Auth:AdminUsername=${{ secrets.TEMP_AUTH_ADMIN_USERNAME }}" \
              "Auth:AdminPassword=${{ secrets.TEMP_AUTH_ADMIN_PASSWORD }}" \
              "Auth:AdminEmail=${{ secrets.TEMP_AUTH_ADMIN_EMAIL }}" \
            --output none

      - name: Restart both slots to pick up new settings
        run: |
          az functionapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}"
          az functionapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --slot staging
