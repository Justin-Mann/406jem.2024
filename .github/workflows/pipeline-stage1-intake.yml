name: Stage 1 - Feature Request Intake

on:
  issues:
    types: [labeled]

jobs:
  intake:
    if: github.event.label.name == 'claude'
    concurrency:
      group: stage1-intake-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Claude - Analyze Feature Request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_NOTIFY_PAT }}
          claude_args: "--max-turns 15 --permission-mode bypassPermissions"
          show_full_output: true
          prompt: |
            You are Stage 1 of a multi-agent CI/CD pipeline for the 406jem.2026 repository.

            A new feature request has been submitted (Issue #${{ github.event.issue.number }}):

            Title: ${{ github.event.issue.title }}
            Body:
            ${{ github.event.issue.body }}

            Your job:
            1. Analyze the feature request for completeness and clarity.
            2. Break it down into concrete implementation tasks.
            3. Identify which parts of the codebase will be affected (Blazor client, Angular client, backend APIs, shared libraries).
            4. Post a comment on the issue summarizing your analysis and the implementation plan.
            5. Add the label "ready-for-branch" to signal Stage 2 to proceed.

            Be specific and technical. The downstream agents (branch creation, coding, review) will use your analysis.

            Keep this pass lightweight: a handful of targeted greps/reads to confirm the affected
            files and existing patterns is enough — you are analyzing and planning, not
            implementing, so there's no need to read entire files end-to-end or explore the
            codebase exhaustively. Stage 3 will read the full relevant code itself before writing
            any changes. Budget for well under 15 turns; if you're still exploring past turn 10,
            wrap up with what you have rather than continuing to dig.
